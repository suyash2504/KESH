<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KESH · OG options</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; font-family:'DM Sans', sans-serif; }
  .card { position:relative; width:1200px; height:630px; overflow:hidden; display:none; }
  .logo { display:inline-flex; align-items:baseline; font-family:'Playfair Display', serif; font-weight:500; letter-spacing:.14em; line-height:1; white-space:nowrap; }
  .logo svg { height:.71em; width:auto; margin:0 .1em 0 -.04em; overflow:visible; }
  .eyebrow { font-size:15px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; }
  h1 { font-family:'Playfair Display', serif; font-weight:400; line-height:1.06; letter-spacing:-.01em; }
  h1 em { font-style:italic; }
  .tag { position:absolute; font-size:14px; letter-spacing:.06em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="k" viewBox="-26 0 108 100">
      <rect x="0" y="0" width="17" height="100" fill="currentColor"/>
      <path d="M17 51 L66 0 L76 0 L17 61 Z" fill="currentColor"/>
      <path d="M23 44 L82 100 L62 100 L13 55 Z" fill="currentColor"/>
      <path d="M8 50 L-6 39 M8 58 L-6 69" stroke="currentColor" stroke-width="4"/>
      <circle cx="-13" cy="32" r="9" fill="none" stroke="currentColor" stroke-width="4.5"/>
      <circle cx="-13" cy="76" r="9" fill="none" stroke="currentColor" stroke-width="4.5"/>
      <circle cx="18" cy="54" r="4.5" fill="var(--bg)" stroke="currentColor" stroke-width="3"/>
    </symbol>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".01 .022" numOctaves="3" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="60" />
    </filter>
    <filter id="smear" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".014 .035" numOctaves="4" seed="3" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="80" />
    </filter>
  </defs>
</svg>

<!-- 1 · Split: copy left, torn-edge photo right (mirrors the live hero) -->
<div class="card" id="c1" style="--bg:#e8d2bd;background:#e8d2bd;color:#1c1714">
  <svg viewBox="0 0 700 630" preserveAspectRatio="xMidYMid slice" style="position:absolute;right:0;top:0;width:700px;height:630px">
    <defs><mask id="m1"><path filter="url(#rough)" fill="#fff" d="M200 -40 C 150 90, 250 170, 180 260 C 120 350, 220 420, 160 520 C 130 590, 210 640, 190 680 L 760 680 L 760 -40 Z"/></mask></defs>
    <path filter="url(#smear)" fill="#f3e6d8" d="M165 -40 C 115 90, 215 170, 145 260 C 85 350, 185 420, 125 520 C 95 590, 175 640, 155 680 L 360 680 L 360 -40 Z"/>
    <path filter="url(#smear)" fill="#d8b99d" opacity=".55" d="M150 -40 C 100 100, 200 180, 130 270 C 75 360, 165 430, 110 530 C 85 600, 160 650, 140 680 L 220 680 L 220 -40 Z"/>
    <g mask="url(#m1)"><image href="https://images.unsplash.com/photo-1605369572399-05d8d64a0f6e?w=1200&q=85&auto=format" x="140" y="-60" width="580" height="760" preserveAspectRatio="xMidYMid slice"/></g>
  </svg>
  <div style="position:absolute;left:72px;top:64px"><span class="logo" style="font-size:40px"><svg viewBox="0 0 108 100"><use href="#k"/></svg>ESH</span></div>
  <div style="position:absolute;left:72px;top:212px;width:560px">
    <h1 style="font-size:78px">Hair that feels<br>like <em>you.</em></h1>
    <p style="font-size:22px;color:#2d2520;margin-top:24px;line-height:1.45">Cuts, colour, skin and grooming for everyone.</p>
  </div>
  <div class="tag" style="left:72px;bottom:52px;color:#5e5047">UNISEX HAIR &amp; BEAUTY STUDIO</div>
</div>

<!-- 2 · Full-bleed photo with a sand wash, copy over the left -->
<div class="card" id="c2" style="--bg:#1c1714;color:#f3e6d8">
  <img src="https://images.unsplash.com/photo-1605369572399-05d8d64a0f6e?w=1400&q=85&auto=format" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%">
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,#1c1714 0%,#1c1714e6 34%,#1c171400 70%)"></div>
  <div style="position:absolute;left:72px;top:64px"><span class="logo" style="font-size:40px"><svg viewBox="0 0 108 100"><use href="#k"/></svg>ESH</span></div>
  <div style="position:absolute;left:72px;bottom:120px;width:520px">
    <h1 style="font-size:74px">Hair that feels<br>like <em>you.</em></h1>
  </div>
  <div class="tag" style="left:72px;bottom:56px;color:#e8d2bdb3">UNISEX HAIR &amp; BEAUTY STUDIO</div>
</div>

<!-- 3 · Typographic: the wordmark alone on sand, over a cream smear -->
<div class="card" id="c3" style="--bg:#e8d2bd;background:#e8d2bd;color:#1c1714">
  <svg viewBox="0 0 1200 630" style="position:absolute;inset:0;width:100%;height:100%">
    <path filter="url(#smear)" fill="#f3e6d8" d="M120 250 C 400 210, 820 215, 1090 240 L 1080 400 C 800 425, 380 420, 110 395 Z"/>
    <path filter="url(#smear)" fill="#d8b99d" opacity=".45" d="M150 380 C 420 395, 800 398, 1060 385 L 1056 410 C 790 430, 410 428, 146 405 Z"/>
  </svg>
  <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
    <div>
      <span class="logo" style="font-size:150px;margin-right:-.14em"><svg viewBox="0 0 108 100"><use href="#k"/></svg>ESH</span>
      <p class="eyebrow" style="margin-top:96px;color:#5e5047">Unisex hair &amp; beauty studio</p>
    </div>
  </div>
</div>

<script>
  const v = new URLSearchParams(location.search).get('v') || '1'
  document.getElementById('c' + v).style.display = 'block'
</script>
</body>
</html>
